<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="game-container">

    <main class="game">
      <p class="title">Rock Paper Scissors</p>

      <div class="moves">
        <button class="move-button js-rock-button">
          <img class="move-icon" src="images/rock-emoji.png" alt="Rock">
        </button>

        <button class="move-button js-paper-button">
          <img class="move-icon" src="images/paper-emoji.png" alt="Paper">
        </button>

        <button class="move-button js-scissors-button">
          <img class="move-icon" src="images/scissors-emoji.png" alt="Scissors">
        </button>
      </div>

      <p class="js-result result">Choose your move!</p>
      <p class="js-moves"></p>

      <p class="js-score score"></p>

      <div class="controls">
        <button class="reset-button" onclick="
          score.wins = 0;
          score.losses = 0;
          score.ties = 0;
          localStorage.removeItem('score');
          updateScoreElement();
        ">Reset Score</button>

        <button class="auto-play-button" onclick="autoPlay()">
          Auto Play
        </button>
      </div>
    </main>


    <aside class="side-panel">
      <h2>How to Play</h2>
      <p>Choose your move and beat the computer!</p>

      <div class="shortcut">
        <span>🪨 Rock</span>
        <kbd>R</kbd>
      </div>

      <div class="shortcut">
        <span>📄 Paper</span>
        <kbd>P</kbd>
      </div>

      <div class="shortcut">
        <span>✂️ Scissors</span>
        <kbd>S</kbd>
      </div>

      <hr>

      <h3>Game Rules</h3>
      <p>🪨 Rock beats Scissors</p>
      <p>📄 Paper beats Rock</p>
      <p>✂️ Scissors beats Paper</p>

      <p class="tip">Tip: Use your keyboard to play faster!</p>
    </aside>

  </div>

  <script src="scripts.js"></script>
</body>
</html>
